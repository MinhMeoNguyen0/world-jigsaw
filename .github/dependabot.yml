# One entry per ecosystem and directory. Add new workspaces (for example a Gradle
# backend) as further entries in the list below.
version: 2
updates:
  # pnpm workspace: the root manifest and lockfile cover apps/web.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
