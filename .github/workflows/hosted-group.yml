name: Hosted group regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  group-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: worldjigsaw
          POSTGRES_USER: worldjigsaw
          POSTGRES_PASSWORD: worldjigsaw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worldjigsaw -d worldjigsaw"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @world-jigsaw/web exec playwright install --with-deps chromium
      - name: Build backend
        working-directory: services/backend
        run: ./gradlew bootJar
      - name: Start disposable fixture stack
        run: |
          mkdir -p "$RUNNER_TEMP/group-logs"
          (cd services/backend && java -jar build/libs/world-jigsaw-backend-0.0.1-SNAPSHOT.jar \
            "--game-import-day=$(date -u +%F)" \
            --game-import-file=../../packages/generator/fixtures/hoi-an-expanded-60.json) > "$RUNNER_TEMP/group-logs/backend.log" 2>&1 &
          pnpm --filter @world-jigsaw/web dev --host 127.0.0.1 > "$RUNNER_TEMP/group-logs/web.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'SETUP FAILURE: fixture stack did not become healthy' >&2
          exit 1
      - name: Exercise group interaction
        run: pnpm --filter @world-jigsaw/web exec playwright test --config hosted-playwright.config.js 2>&1 | tee "$RUNNER_TEMP/group-logs/test.log"
        shell: bash
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-group-failure
          path: |
            ${{ runner.temp }}/group-logs/
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
